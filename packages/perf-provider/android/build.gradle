apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'com.facebook.react'

def getExtOrDefault(name, fallback) {
  rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace 'com.rnperfkit'
  compileSdkVersion getExtOrDefault('compileSdkVersion', 35)
  defaultConfig {
    minSdkVersion getExtOrDefault('minSdkVersion', 24)
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.metrics:metrics-performance:1.0.0-beta01'
}
