name: Performance Budget & Regression Check

on:
  pull_request:
    branches: [main]

jobs:
  perf-check:
    name: Performance Budget Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Integration Simulation & Generate Report
        run: node scripts/run-integration-tests.js --output session.json

      - name: Enforce Performance Budgets via CLI
        run: node packages/cli/dist/cli.js check --budgets perf.config.ts --report session.json
